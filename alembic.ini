# Archivo de configuración de Alembic para el servicio Viajes y zonas.

[alembic]
# Ruta al directorio de migraciones
script_location = alembic
# Base de datos (se sobrescribe desde el entorno al ejecutar)
sqlalchemy.url = ${DATABASE_URL}

# Plantilla para generar nuevas migraciones
file_template = %%(rev)s_%%(slug)s

# Versión de la base de datos
version_table = schema_migrations

[post_write_hooks]
# Hook para limpiar el código generado
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
